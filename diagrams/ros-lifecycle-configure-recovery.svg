<svg xmlns="http://www.w3.org/2000/svg" width="960" height="688" viewBox="0 0 960 688" role="img" aria-labelledby="t d"><title id="t">Three outcomes during configure</title><desc id="d">Ordinary failure returns to unconfigured without error processing. Recovery succeeds to unconfigured or fails to finalized.</desc><rect width="960" height="688" fill="#F5FAF9"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="60" fill="#172D39" font-size="44" font-weight="700" text-anchor="start">Three outcomes during configure</text><text x="48" y="108" fill="#3C5665" font-size="28" font-weight="400" text-anchor="start">Trace begins in Unconfigured for all three rows</text><rect x="48" y="148" width="864" height="131" rx="18" fill="#FCF1D4"/><text x="76" y="196" fill="#785000" font-size="34" font-weight="700" text-anchor="start">Blank configuration</text><text x="76" y="248" fill="#172D39" font-size="30" font-weight="400" text-anchor="start">Configuring  →  Unconfigured</text><rect x="48" y="301" width="864" height="131" rx="18" fill="#DAF0E6"/><text x="76" y="349" fill="#146858" font-size="34" font-weight="700" text-anchor="start">Injected error, recovery succeeds</text><text x="76" y="401" fill="#172D39" font-size="30" font-weight="400" text-anchor="start">Configuring  →  Error processing  →  Unconfigured</text><rect x="48" y="454" width="864" height="131" rx="18" fill="#F8E7E9"/><text x="76" y="502" fill="#8E323E" font-size="34" font-weight="700" text-anchor="start">Injected error, recovery fails</text><text x="76" y="554" fill="#172D39" font-size="30" font-weight="400" text-anchor="start">Configuring  →  Error processing  →  Finalized</text><text x="48" y="646" fill="#146858" font-size="29" font-weight="700" text-anchor="start">A successful recovery does not activate the node.</text></g></svg>
