<svg xmlns="http://www.w3.org/2000/svg" width="960" height="710" viewBox="0 0 960 710" role="img" aria-labelledby="t d"><title id="t">When does the camera publish?</title><desc id="d">Samples 11, 12 and 14 publish while active. Samples 10, 13 and 15 are suppressed.</desc><rect width="960" height="710" fill="#F5FAF9"/><g font-family="DejaVu Sans, sans-serif"><text x="48" y="58" fill="#172D39" font-size="47" font-weight="700" text-anchor="start">When does the camera publish?</text><text x="48" y="108" fill="#3C5665" font-size="29" font-weight="400" text-anchor="start">One row per synthetic frame in bringup.json</text><text x="73" y="168" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Sample</text><text x="303" y="168" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Node state</text><text x="700" y="168" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Frame output</text><rect x="48" y="190" width="864" height="60" rx="18" fill="#E7EFF2"/><text x="73" y="231" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">10</text><text x="303" y="231" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Inactive</text><text x="700" y="231" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Suppressed</text><rect x="48" y="262" width="864" height="60" rx="18" fill="#DAF0E6"/><text x="73" y="303" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">11</text><text x="303" y="303" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Active</text><text x="700" y="303" fill="#146858" font-size="30" font-weight="700" text-anchor="start">Published</text><rect x="48" y="334" width="864" height="60" rx="18" fill="#DAF0E6"/><text x="73" y="375" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">12</text><text x="303" y="375" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Active</text><text x="700" y="375" fill="#146858" font-size="30" font-weight="700" text-anchor="start">Published</text><rect x="48" y="406" width="864" height="60" rx="18" fill="#E7EFF2"/><text x="73" y="447" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">13</text><text x="303" y="447" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Inactive</text><text x="700" y="447" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Suppressed</text><rect x="48" y="478" width="864" height="60" rx="18" fill="#DAF0E6"/><text x="73" y="519" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">14</text><text x="303" y="519" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Active</text><text x="700" y="519" fill="#146858" font-size="30" font-weight="700" text-anchor="start">Published</text><rect x="48" y="550" width="864" height="60" rx="18" fill="#E7EFF2"/><text x="73" y="591" fill="#172D39" font-size="34" font-weight="700" text-anchor="start">15</text><text x="303" y="591" fill="#172D39" font-size="33" font-weight="400" text-anchor="start">Finalized</text><text x="700" y="591" fill="#3C5665" font-size="30" font-weight="700" text-anchor="start">Suppressed</text><text x="48" y="670" fill="#146858" font-size="30" font-weight="700" text-anchor="start">Three frames published. All were Active.</text></g></svg>
